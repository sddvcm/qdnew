# 飞牛 NAS (fnOS) Docker Compose 部署配置
#
# 用法：
#   1. 把整个 checkin-system 目录上传到 NAS，例如 /vol1/docker/checkin-system
#   2. SSH 进 NAS，cd 到该目录
#   3. docker compose up -d --build
#
# 首次必须做的两件事：
#   a) 改 .env 里的 CHECKIN_SECRET_KEY（生产密钥，泄露 = 数据库可被解密）
#   b) 确认下面 volumes 里的代码挂载生效（见注释）

services:
  checkin:
    build: .
    image: checkin-system:latest
    container_name: checkin-system
    restart: unless-stopped
    ports:
      - "5800:5800"

    volumes:
      # ---- 代码目录（整目录挂载，程序内更新才会持久化）----
      # ⚠️ 这是「自动更新后不用重新部署」的前提。不挂载的话，更新写进去的
      #    文件在容器重建后就丢了。
      #    依赖装在 /usr/local/lib（site-packages），不在 /app，
      #    所以挂载不会覆盖已安装的依赖。
      #    但若更新改了 requirements.txt，需 docker compose up -d --build 重建。
      - ./:/app

    environment:
      # ⚠️ 生产环境必须改！从 .env 文件读取（同目录），没有则用默认值
      - CHECKIN_SECRET_KEY=${CHECKIN_SECRET_KEY:-change-me-to-a-random-string}
      - TZ=Asia/Shanghai
      # 更新/推送走外网时不走系统代理；如需代理改成 http://ip:port
      - NO_PROXY=${NO_PROXY:-}

    # 健康检查：容器起来后每 60 秒访问一次首页
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5800/')"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

    # 日志轮转，避免长期运行把磁盘写满
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
